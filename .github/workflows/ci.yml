name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Test and lint backend
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          ruff check app tests alembic
          ruff format --check app tests alembic
          pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: whatsapp-bridge/package-lock.json

      - name: Check WhatsApp bridge
        working-directory: whatsapp-bridge
        run: |
          npm ci --ignore-scripts
          npm run check

      - name: Prepare CI environment
        run: |
          cp .env.example .env
          sed -i 's/CHANGE_ME_LONG_RANDOM_PASSWORD/ci_database_password/g' .env
          sed -i 's/CHANGE_ME_LONG_RANDOM_TOKEN/ci_bridge_token_0123456789abcdef/g' .env
          password_hash="$(docker run --rm caddy:2.8-alpine caddy hash-password --plaintext 'ci-password')"
          sed -i '/^PANEL_PASSWORD_HASH=/d' .env
          printf "PANEL_PASSWORD_HASH='%s'\n" "$password_hash" >> .env
          docker network create multiplekser-shared

      - name: Validate and build containers
        run: |
          docker compose config --quiet
          docker compose build

      - name: Start core stack
        run: |
          docker compose up -d postgres backend caddy
          for attempt in $(seq 1 30); do
            if curl -fsS -u admin:ci-password http://127.0.0.1/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color --tail=300

      - name: Stop stack
        if: always()
        run: docker compose down
