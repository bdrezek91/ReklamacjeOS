<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ReklamacjeOS{% endblock %}</title>
  <link rel="stylesheet" href="{{ root_path }}/static/app.css">
  <link rel="stylesheet" href="{{ root_path }}/static/stage4.css">
  <link rel="stylesheet" href="{{ root_path }}/static/theme_v2.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ root_path }}/"><span class="brand-dampol">DAMPOL</span><span class="brand-divider">/</span>ReklamacjeOS</a>
    <div class="topbar-right">
      <span class="environment">OBSŁUGA REKLAMACJI PRODUKCYJNYCH</span>
      <form method="post" action="{{ root_path }}/logout"><button class="logout-button" type="submit">Wyloguj</button></form>
    </div>
  </header>
  <div class="layout">
    <nav class="sidebar" aria-label="Główna nawigacja">
      <a class="{{ 'active' if active == 'dashboard' else '' }}" href="{{ root_path }}/">Pulpit</a>
      <a class="{{ 'active' if active == 'work-action' else '' }}" href="{{ root_path }}/work/action"><span>Do zrobienia</span></a>
      <a class="{{ 'active' if active == 'work-waiting' else '' }}" href="{{ root_path }}/work/waiting"><span>Czekamy</span></a>
      <a class="{{ 'active' if active == 'work-closed' else '' }}" href="{{ root_path }}/work/closed"><span>Zamknięte</span></a>
      <details class="sidebar-more" {% if active in ['inbox','suppliers','drafts','pending','accepted','ready','sent','work-all'] %}open{% endif %}>
        <summary>Więcej</summary>
        <a class="{{ 'active' if active == 'work-all' else '' }}" href="{{ root_path }}/work/all">Wszystkie reklamacje</a>
        <a class="{{ 'active' if active == 'inbox' else '' }}" href="{{ root_path }}/inbox">Surowe wiadomości</a>
        <a class="{{ 'active' if active == 'suppliers' else '' }}" href="{{ root_path }}/suppliers">Dostawcy</a>
        <a href="{{ root_path }}/complaints/drafts">Statusy techniczne</a>
      </details>
    </nav>
    <main class="content">{% block content %}{% endblock %}</main>
  </div>
</body>
</html>
